[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty-hierarchical-planner"
version = "0.1.0"
description = "Transformer intent generation and conditional diffusion refinement with uncertainty-aware safety guidance"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
